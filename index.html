<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hadas Ben Mordechai</title>
    <meta name="description" content="Welcome to my portfolio page!" />

    <meta property="og:image" content="https://hadasbenmordechai.github.io/og.jpg" />

    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=poppins:300,400,600,700" rel="stylesheet" />

    <!-- Apply the theme before first paint to avoid a light flash (same storage key as useDark) -->
    <script>
      try {
        const mode = localStorage.getItem('vueuse-color-scheme');
        const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
        if (mode === 'dark' || ((!mode || mode === 'auto') && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
  </head>

  <body class="font-poppins bg-page text-ink">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
